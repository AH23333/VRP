[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrp"
version = "0.1.0"
description = "Vibe project restructuring analysis pipeline (S0-S5)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vrp = "vrp.cli:main"

[tool.setuptools.packages.find]
include = ["vrp*"]

[tool.setuptools.package-data]
vrp = ["schema/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
